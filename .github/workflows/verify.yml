name: verify

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline verification (checksums, schema, URL policy)
        run: python3 scripts/verify.py
      - name: Online verification (upstream URL liveness)
        run: python3 scripts/verify.py --online
